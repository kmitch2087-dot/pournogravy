# This worker handles inbound email for opie@pournogravy.com.
# Deploy with: cd cloudflare-workers/receive-email && npx wrangler deploy
#
# After deploying, go to:
#   Cloudflare Dashboard → Email → Email Routing → Routes
# Add a rule: opie@pournogravy.com → Worker → pournogravy-receive-email

[vars]
# Set these as secrets via wrangler secret put, NOT here:
#   npx wrangler secret put SUPABASE_URL
